name: Build pylib

on:
  push:
    branches: [ rewrite ]
  pull_request:
    branches: [ rewrite ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: |
          cmake -S . -B build `
            -DPython3_ROOT_DIR="${{ env.pythonLocation }}" `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release --target pylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: build/Release/pylib.pyd


  build-linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      PYTHON: /opt/python/cp311-cp311/bin/python
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: |
          "$PYTHON" -m pip install --upgrade "cmake>=3.26"
          echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          cmake --version
          gcc --version
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_ROOT_DIR=/opt/python/cp311-cp311 \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release --target pylib --parallel

      - name: Check glibc / libstdc++ requirements
        run: |
          echo "Highest GLIBC required:"
          objdump -T build/pylib.abi3.so | grep -oE 'GLIBC_[0-9.]+' | sort -V | uniq | tail -1
          echo "Highest GLIBCXX required:"
          objdump -T build/pylib.abi3.so | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | uniq | tail -1

      - name: Run tests
        run: PYTHONPATH="$PWD/build" "$PYTHON" -m unittest discover -s tests -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: build/pylib.abi3.so


  build-macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build x86_64
        run: |
          cmake -S . -B build_x86_64 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_ROOT_DIR="${{ env.pythonLocation }}" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build_x86_64 --config Release --target pylib

      - name: Build arm64
        run: |
          cmake -S . -B build_arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_ROOT_DIR="${{ env.pythonLocation }}" \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build_arm64 --config Release --target pylib

      - name: Create universal binary
        run: |
          mkdir -p build_universal
          lipo -create \
            ./build_x86_64/pylib.abi3.so \
            ./build_arm64/pylib.abi3.so \
            -output ./build_universal/pylib.abi3.so

      - name: List universal binary
        run: lipo -info ./build_universal/pylib.abi3.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: ./build_universal/pylib.abi3.so
