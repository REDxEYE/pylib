[package]
name = "rustlib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rustlib"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "playground"
path = "src/main.rs"

[[bin]]
name = "generate_pyi"
path = "src/generate_pyi.rs"

[dependencies]
pyo3 = { version = "0.21.2", features = ["abi3", "experimental-inspect", "abi3-py37", "extension-module"] }
numpy = { version = "0.21.0", features = ["half"] }
lz4-sys = { git = "https://github.com/REDxEYE/lz4-rs" }
zstd = "0.13.1"
binread = "2.2.0"
bitflags = "2.5.0"
regex = "1.10.4"
thiserror = "1.0.59"
byteorder = "1.5.0"
uuid = { version = "1.8.0", features = ["v4"] }
log = "0.4.21"
half = { version = "2.4.1", features = ["std", "zerocopy"] }
nalgebra = { version = "0.32.5" }
fnmatch-regex2 = "0.3.0"
image = { version = "0.25.1", default-features = false, features = ["rayon", "hdr", "png"] }
rayon = "1.10.0"
vtflib2 = { git = "https://github.com/lasa01/vtflib2-rs", features = ["static"] }
texture2ddecoder = { version = "0.0.5", features = ["alloc"] }

[dev-dependencies]

binary-reader = "0.4.5"

[profile.release]
debug = true

